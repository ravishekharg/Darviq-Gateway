# Nginx sits in front of Kong as the edge layer: it is the only thing that
# terminates TLS and the only thing exposed beyond the local Docker
# network. Kong's own proxy port (8000) is never exposed directly to
# clients in this topology - only to Nginx, over plain HTTP inside the
# Compose network. See the README "Why Nginx AND Kong" section for the
# reasoning.
#
# The upstream block also doubles as the load-balancing point: today it
# has one Kong replica, but Nginx will round-robin across every `server`
# line added here - so scaling Kong horizontally is a one-line change in
# this file, no application changes required.
upstream kong_upstream {
    server kong:8000 max_fails=3 fail_timeout=10s;
    # server kong-2:8000 max_fails=3 fail_timeout=10s;  # add replicas here
    keepalive 32;
}

# Plain HTTP is accepted only to redirect to HTTPS. Nothing is proxied
# over port 80.
server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # --- TLS termination -----------------------------------------------
    # Self-signed, generated locally by scripts/generate-certs.sh - see
    # the README's "TLS certificates" section for how to swap these for a
    # real certificate (Let's Encrypt / an internal CA) in production.
    ssl_certificate     /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 5m;

    # Everything under /api/ is reverse-proxied to Kong, which owns
    # routing to the actual backend services from here (see
    # kong/kong.yml). Nginx does not know or care that users-service,
    # orders-service, and reports-service exist - that's Kong's job.
    location /api/ {
        proxy_pass http://kong_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Simple edge health check that does not traverse Kong - useful for a
    # load balancer / uptime probe in front of Nginx itself.
    location = /healthz {
        access_log off;
        return 200 '{"status":"ok","component":"nginx-edge"}';
        add_header Content-Type application/json;
    }

    location / {
        return 404 '{"error":"not found - all routes are served under /api/"}';
        add_header Content-Type application/json;
    }
}
