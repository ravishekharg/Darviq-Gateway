name: CI

# Honesty note (also in the README): every job below runs a real check
# against the actual files in this repo - nothing here is decorative.
# ubuntu-latest runners ship with Docker and Docker Compose preinstalled,
# so the compose/e2e jobs genuinely build and run the stack, they don't
# just lint YAML.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-kong-config:
    name: Validate Kong declarative config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `kong config parse` loads kong/kong.yml through Kong's own
      # declarative-config schema validator - the same code path Kong
      # uses on startup - without needing a running proxy or database.
      - name: kong config parse
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/kong:/kong-config:ro" \
            kong:3.7 \
            kong config parse /kong-config/kong.yml

  validate-compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config --quiet

  validate-nginx-config:
    name: Validate Nginx edge config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # nginx -t fully parses nginx.conf + conf.d/*.conf and checks that
      # referenced files (the TLS cert/key) exist - so certs are
      # generated first, exactly as a real setup would.
      - name: Generate local certs
        run: ./scripts/generate-certs.sh

      - name: nginx -t
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "${{ github.workspace }}/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "${{ github.workspace }}/nginx/certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine \
            nginx -t

  validate-kubernetes-yaml:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # kubeconform validates structure/types against upstream OpenAPI
      # schemas. Kong's CRDs (KongPlugin, KongClusterPlugin, KongConsumer)
      # have no public schema to fetch, so they're explicitly skipped
      # with -skip rather than silently "passing" - the job only claims
      # to validate what it can actually validate.
      - name: Run kubeconform
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/kubernetes:/kubernetes:ro" \
            ghcr.io/yannh/kubeconform:latest-alpine \
            -summary \
            -skip KongPlugin,KongClusterPlugin,KongConsumer \
            -ignore-missing-schemas \
            /kubernetes/namespace.yaml \
            /kubernetes/backend-services \
            /kubernetes/ingress \
            /kubernetes/cert-manager

      # helm-values.yaml is a values override, not a standalone manifest -
      # kubeconform can't validate it (it's not a Kubernetes object). It's
      # covered instead by lint-helm-values below.

  lint-helm-values:
    name: Lint Kong Helm values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # `helm template` renders the actual kong/kong chart with our
      # values override and fails on schema/type errors - a real check
      # that helm-values.yaml is well-formed against the real chart, not
      # just valid YAML.
      - name: helm template kong/kong with our values
        run: |
          helm repo add kong https://charts.konghq.com
          helm repo update
          helm template kong-nginx-gateway-demo kong/kong \
            -f kubernetes/kong/helm-values.yaml \
            --namespace gateway-demo > /dev/null

  e2e-smoke-test:
    name: End-to-end smoke test (compose stack)
    runs-on: ubuntu-latest
    needs: [lint-kong-config, validate-compose, validate-nginx-config]
    steps:
      - uses: actions/checkout@v4

      - name: Generate local certs
        run: ./scripts/generate-certs.sh

      - name: Build and start the stack
        run: |
          cp .env.example .env
          docker compose up --build -d

      - name: Wait for all services to report healthy
        run: |
          for i in $(seq 1 30); do
            unhealthy=$(docker compose ps --format '{{.Name}} {{.Health}}' | grep -v -E 'healthy|^$' || true)
            if [ -z "$unhealthy" ]; then
              echo "All services healthy."
              break
            fi
            echo "Waiting for services to become healthy... ($i/30)"
            sleep 5
          done
          docker compose ps

      - name: Request through Nginx -> Kong -> orders-service (unauthenticated route)
        run: |
          curl -sk --fail https://localhost:8443/api/orders | tee /tmp/orders.json
          grep -q '"service":"orders-service"' /tmp/orders.json

      - name: Unauthenticated request to the key-auth-protected route is rejected
        run: |
          status=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/api/users)
          echo "status=$status"
          test "$status" = "401"

      - name: Authenticated request to the key-auth-protected route succeeds
        run: |
          curl -sk --fail -H "apikey: demo-key-CHANGE-ME-6f3a9c1d" https://localhost:8443/api/users | tee /tmp/users.json
          grep -q '"service":"users-service"' /tmp/users.json

      - name: Rate limiting trips a 429 on orders-service (limit is 5/min)
        run: |
          statuses=""
          for i in $(seq 1 8); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/api/orders)
            statuses="$statuses $code"
          done
          echo "statuses:$statuses"
          echo "$statuses" | grep -q "429"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
