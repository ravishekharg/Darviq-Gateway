name: kong-nginx-gateway

# Full local stack: Nginx (TLS edge / reverse proxy) -> Kong (DB-less API
# gateway) -> three minimal backend services.
#
# Quick start:
#   cp .env.example .env               # optional, defaults work as-is
#   ./scripts/generate-certs.sh        # one-time, creates nginx/certs/*
#   docker compose up --build
#
# Then see the README for curl examples through the full chain.

services:
  users-service:
    build:
      context: ./services/users-service
    image: kong-nginx-gateway/users-service:local
    environment:
      PORT: "3001"
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - gateway-net

  orders-service:
    build:
      context: ./services/orders-service
    image: kong-nginx-gateway/orders-service:local
    environment:
      PORT: "3002"
    expose:
      - "3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - gateway-net

  reports-service:
    build:
      context: ./services/reports-service
    image: kong-nginx-gateway/reports-service:local
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gateway-net

  kong:
    image: kong:3.7
    depends_on:
      users-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      reports-service:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    expose:
      - "8000"
    ports:
      # Admin API published to the host for local inspection only
      # (curl http://localhost:8001/status). It is NOT exposed through
      # Nginx and must never be reachable from outside the host in a real
      # deployment - see the README security notes.
      - "${KONG_ADMIN_HOST_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gateway-net

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      kong:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${NGINX_HTTP_HOST_PORT:-8080}:80"
      - "${NGINX_HTTPS_HOST_PORT:-8443}:443"
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge
