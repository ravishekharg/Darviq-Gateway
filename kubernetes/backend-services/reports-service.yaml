# See users-service.yaml for image build/push notes - same pattern applies.
# reports-service listens on 8000 (uvicorn default) rather than a 300x port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports-service
  namespace: gateway-demo
  labels:
    app: reports-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reports-service
  template:
    metadata:
      labels:
        app: reports-service
    spec:
      containers:
        - name: reports-service
          image: REPLACE_ME_REGISTRY/kong-nginx-gateway-reports-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: reports-service
  namespace: gateway-demo
spec:
  selector:
    app: reports-service
  ports:
    - port: 8000
      targetPort: 8000
      name: http
