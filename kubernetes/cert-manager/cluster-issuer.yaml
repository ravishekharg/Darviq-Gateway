# Real TLS in a cluster context: cert-manager + Let's Encrypt.
#
# This is the Kubernetes-path equivalent of scripts/generate-certs.sh -
# instead of a self-signed cert generated by a local script, cert-manager
# requests, renews, and stores a real certificate as a Kubernetes Secret.
#
# Prerequisites (not included in this repo - install once per cluster):
#   helm repo add jetstack https://charts.jetstack.io
#   helm repo update
#   helm install cert-manager jetstack/cert-manager \
#     --namespace cert-manager --create-namespace \
#     --set installCRDs=true
#
# Replace the email below, then:
#   kubectl apply -f cluster-issuer.yaml
#
# and reference it from an Ingress:
#   metadata:
#     annotations:
#       cert-manager.io/cluster-issuer: letsencrypt-prod
#   spec:
#     tls:
#       - hosts: ["api.example.com"]
#         secretName: gateway-tls   # cert-manager creates/renews this Secret
#
# HTTP-01 requires the cluster's Ingress/LoadBalancer to be reachable on
# port 80 from the public internet for the ACME challenge. For private
# clusters, use a DNS-01 issuer (Route53, Cloudflare, etc.) instead - see
# https://cert-manager.io/docs/configuration/acme/dns01/
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: REPLACE_ME@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: kong
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE_ME@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: kong
